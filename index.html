<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Dino Stazione — organizza treni, binari e partenze, giocando.">
<meta name="theme-color" content="#294c69">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dino Stazione">
<title>Dino Stazione</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%; width: 100%;
  overflow: hidden; background: #0b2418;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  overscroll-behavior: none; touch-action: none;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
#c { position: fixed; inset: 0; display: block; touch-action: none; }

/* ---- text entry overlay (only place we use DOM: we want the native keyboard) ---- */
#ovl {
  position: fixed; inset: 0; display: none; z-index: 10;
  align-items: center; justify-content: center;
  background: rgba(8, 26, 18, .72); backdrop-filter: blur(3px);
  padding: 16px;
}
#ovl.on { display: flex; }
#ovl .card {
  background: #fff6e0; border: 6px solid #7a4a26; border-radius: 26px;
  padding: 22px 24px; width: min(460px, 92vw);
  box-shadow: 0 18px 40px rgba(0,0,0,.45);
}
#ovl h2 { margin: 0 0 14px; font-size: 24px; color: #2b1d12; font-weight: 800; }
#ovl input {
  width: 100%; font-size: 26px; padding: 12px 14px; border-radius: 14px;
  border: 4px solid #cdb389; background: #fffdf6; color: #2b1d12;
  font-family: inherit; font-weight: 700; outline: none;
}
#ovl input:focus { border-color: #2f8f4e; }
#ovl .row { display: flex; gap: 12px; margin-top: 18px; }
#ovl button {
  flex: 1; font-size: 22px; font-weight: 800; padding: 14px 10px;
  border-radius: 16px; border: none; color: #fff; font-family: inherit;
  cursor: pointer; min-height: 60px;
}
#ovl .ok { background: #2f8f4e; }
#ovl .no { background: #a8998a; }

/* ---- portrait nudge ---- */
#rot {
  position: fixed; inset: 0; display: none; z-index: 20;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; background: #123d29; color: #fff6e0; text-align: center; padding: 30px;
}
#rot.on { display: flex; }
#rot .ico { font-size: 84px; animation: tilt 1.8s ease-in-out infinite; }
#rot p { font-size: 26px; font-weight: 800; margin: 0; line-height: 1.35; }
@keyframes tilt { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-90deg); } }

@media (prefers-reduced-motion: reduce) { #rot .ico { animation: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ovl" role="dialog" aria-modal="true">
  <div class="card">
    <h2 id="ovl-t">Come ti chiami?</h2>
    <input id="ovl-i" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" maxlength="14">
    <div class="row">
      <button class="no" id="ovl-n">Annulla</button>
      <button class="ok" id="ovl-y">Va bene</button>
    </div>
  </div>
</div>

<div id="rot"><div class="ico">📱</div><p>Gira il tablet<br>di lato!</p></div>

<script>
/* ==================== 00-core.js ==================== */
/* Dino Stazione — core engine.
   Fixed 1280x720 logical world, letterboxed. Canvas only, no assets, no deps.
   Everything a scene needs hangs off the global `G`. */
(function () {
  'use strict';

  var W = 1280, H = 720;
  var G = (window.G = { W: W, H: H, t: 0, dt: 0, frame: 0 });

  /* ---------------------------------------------------------------- palette */
  G.C = {
    leaf: '#2f8f4e', leafDark: '#1c5c33', leafLight: '#63c777', leafDeep: '#123d29',
    bark: '#7a4a26', barkDark: '#4e2f18',
    sky: '#8fd8e8', skyDeep: '#4bb6d6', sun: '#ffd75e',
    sand: '#f2d9a8', water: '#3fb6c9',
    cream: '#fff6e0', ink: '#2b1d12', shadow: 'rgba(20,10,0,.22)',
    berry: '#e8536b', plum: '#8f5bd6', tangerine: '#ff9f43', mint: '#38d9a9',
    pinkPop: '#ff6fae', blueberry: '#4d80e4',
    dino: '#57c98a', dinoDark: '#379a67', dinoBelly: '#f6e7c1'
  };

  /* ------------------------------------------------------------------ maths */
  G.clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  G.lerp = function (a, b, t) { return a + (b - a) * t; };
  G.ease = function (t) { t = G.clamp(t, 0, 1); return 1 - Math.pow(1 - t, 3); };
  G.easeIn = function (t) { t = G.clamp(t, 0, 1); return t * t * t; };
  G.easeInOut = function (t) { t = G.clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  G.easeBack = function (t) { t = G.clamp(t, 0, 1); var c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  G.rnd = function (a, b) { if (b === undefined) { b = a; a = 0; } return a + Math.random() * (b - a); };
  G.rndi = function (a, b) { return Math.floor(a + Math.random() * (b - a + 1)); };
  G.pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };
  G.shuffle = function (arr) {
    var a = arr.slice(), i, j, t;
    for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  };
  G.dist = function (ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); };

  /* ------------------------------------------------------------- canvas fit */
  var cv = document.getElementById('c');
  var ctx = (G.ctx = cv.getContext('2d', { alpha: false }));
  var view = { s: 1, ox: 0, oy: 0, dpr: 1 };
  G.view = view;
  var rotEl = document.getElementById('rot');

  function resize() {
    var cw = window.innerWidth, ch = window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5, 1440 / Math.max(window.innerWidth, window.innerHeight));
    view.dpr = dpr;
    view.s = Math.min(cw / W, ch / H);
    view.ox = (cw - W * view.s) / 2;
    view.oy = (ch - H * view.s) / 2;
    cv.width = Math.max(1, Math.round(cw * dpr));
    cv.height = Math.max(1, Math.round(ch * dpr));
    cv.style.width = cw + 'px';
    cv.style.height = ch + 'px';
    ctx.imageSmoothingEnabled = true;
    if (rotEl) rotEl.classList.toggle('on', ch > cw * 1.08);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
  resize();

  /* -------------------------------------------------------------- draw help */
  var FONT = '"Trebuchet MS", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif';
  G.font = function (size, weight) { return (weight || 900) + ' ' + size + 'px ' + FONT; };

  G.text = function (str, x, y, o) {
    o = o || {};
    var c = o.ctx || ctx;
    c.save();
    c.font = G.font(o.size || 32, o.weight);
    c.textAlign = o.align || 'center';
    c.textBaseline = o.baseline || 'middle';
    if (o.stroke) {
      c.lineWidth = o.strokeWidth || Math.max(4, (o.size || 32) * .16);
      c.strokeStyle = o.stroke; c.lineJoin = 'round';
      c.strokeText(str, x, y, o.maxWidth);
    }
    c.fillStyle = o.color || G.C.ink;
    c.fillText(str, x, y, o.maxWidth);
    c.restore();
  };

  G.roundRect = function (c, x, y, w, h, r) {
    r = Math.min(r || 0, Math.abs(w) / 2, Math.abs(h) / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  };
  G.shadow = function (c, blur, color, dy) {
    c.shadowBlur = blur; c.shadowColor = color || G.C.shadow;
    c.shadowOffsetX = 0; c.shadowOffsetY = dy === undefined ? blur * .35 : dy;
  };
  G.noShadow = function (c) { c.shadowBlur = 0; c.shadowColor = 'transparent'; c.shadowOffsetX = 0; c.shadowOffsetY = 0; };

  /* ------------------------------------------------------------------ audio */
  var AC = null, master = null, noiseBuf = null;
  function audio() {
    if (AC) return AC;
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    AC = new Ctor();
    master = AC.createGain();
    master.gain.value = .5;
    master.connect(AC.destination);
    var n = AC.createBuffer(1, AC.sampleRate * .5, AC.sampleRate), d = n.getChannelData(0), i;
    for (i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    noiseBuf = n;
    return AC;
  }
  G.resumeAudio = function () { var a = audio(); if (a && a.state === 'suspended') a.resume(); };

  function tone(freq, at, dur, type, gain, slideTo) {
    var a = audio(); if (!a) return;
    var t0 = a.currentTime + at;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain || .22, t0 + Math.min(.02, dur * .3));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + .02);
  }
  function noise(at, dur, gain, freq) {
    var a = audio(); if (!a || !noiseBuf) return;
    var t0 = a.currentTime + at;
    var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq || 1400; f.Q.value = .8;
    g.gain.setValueAtTime(gain || .18, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t0); s.stop(t0 + dur);
  }

  var SFX = {
    tap: function () { tone(680, 0, .07, 'sine', .16, 880); },
    pop: function () { tone(900, 0, .12, 'sine', .2, 420); },
    good: function () { tone(523, 0, .12, 'triangle', .2); tone(659, .09, .12, 'triangle', .2); tone(784, .18, .2, 'triangle', .22); },
    bad: function () { tone(320, 0, .16, 'sine', .16, 240); },
    coin: function () { tone(1180, 0, .07, 'square', .1); tone(1560, .06, .12, 'square', .1); },
    chime: function () { tone(1046, 0, .5, 'sine', .16); tone(1568, .02, .45, 'sine', .07); },
    whoosh: function () { noise(0, .22, .1, 900); },
    win: function () {
      [523, 659, 784, 1046].forEach(function (f, i) { tone(f, i * .1, .3, 'triangle', .2); });
      tone(1318, .42, .5, 'sine', .14);
    },
    hatch: function () { noise(0, .1, .12, 2400); tone(600, .08, .2, 'triangle', .18, 1000); }
  };
  G.sfx = function (name) {
    if (G.save && G.save.mute) return;
    var f = SFX[name]; if (f) { audio(); if (AC) f(); }
  };

  /* ----------------------------------------------------------------- speech */
  var voice = null, voiceTried = false;
  function findVoice() {
    if (!window.speechSynthesis) return null;
    var vs = speechSynthesis.getVoices() || [];
    if (!vs.length) return null;
    return vs.filter(function (v) { return /^it/i.test(v.lang); })[0] || null;
  }
  if (window.speechSynthesis) {
    speechSynthesis.addEventListener && speechSynthesis.addEventListener('voiceschanged', function () { voice = findVoice(); });
  }
  G.say = function (str, o) {
    if (!window.speechSynthesis || !str) return;
    if (G.save && G.save.mute) return;
    o = o || {};
    if (!voiceTried) { voice = findVoice(); voiceTried = true; }
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(String(str));
      u.lang = 'it-IT';
      if (voice) u.voice = voice;
      u.rate = o.rate || .95;
      u.pitch = o.pitch || 1.15;
      u.volume = o.volume === undefined ? 1 : o.volume;
      speechSynthesis.speak(u);
    } catch (e) { /* speech is a bonus, never a blocker */ }
  };
  G.hush = function () { try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {} };

  /* ---------------------------------------------------------------- storage */
  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  G.LS = LS;

  var K_ACCTS = 'ds.accounts', K_LAST = 'ds.last', K_SAVE = 'ds.save.';

  function blankSave() {
    return {
      fruits: 0, stars: 0, mute: false, hat: null, hats: [],
      station: { maxLevel: 1, served: 0, best: {} }, seen: {}, playSec: 0, updated: 0
    };
  }
  function fillSave(s) {
    var b = blankSave(), k;
    for (k in b) if (s[k] === undefined || s[k] === null) s[k] = b[k];
    return s;
  }

  G.account = null;
  G.profile = null;
  G.level = 1;
  G.save = blankSave();

  var saveTimer = 0, saveDirty = false;
  function writeSave() {
    if (!G.account) return;
    G.save.updated = Date.now();
    LS.set(K_SAVE + G.account.id, G.save);
    saveDirty = false;
    if (G.cloud && G.cloud.push) G.cloud.push();
  }
  G.saveNow = function () { saveDirty = true; };
  G.saveFlush = writeSave;

  G.accounts = {
    list: function () { return LS.get(K_ACCTS, []); },
    byId: function (id) { return G.accounts.list().filter(function (a) { return a.id === id; })[0] || null; },
    create: function (o) {
      var list = G.accounts.list();
      var acct = {
        id: 'a' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36),
        name: (o.name || 'Dino').slice(0, 14),
        color: o.color || G.C.dino,
        level: o.level === 2 ? 2 : 1,
        secret: o.secret && o.secret.length ? o.secret : null,
        created: Date.now()
      };
      list.push(acct);
      LS.set(K_ACCTS, list);
      LS.set(K_SAVE + acct.id, blankSave());
      return acct;
    },
    update: function (id, patch) {
      var list = G.accounts.list(), i;
      for (i = 0; i < list.length; i++) if (list[i].id === id) {
        for (var k in patch) list[i][k] = patch[k];
        LS.set(K_ACCTS, list);
        if (G.account && G.account.id === id) G.account = list[i];
        return list[i];
      }
      return null;
    },
    remove: function (id) {
      LS.set(K_ACCTS, G.accounts.list().filter(function (a) { return a.id !== id; }));
      LS.del(K_SAVE + id);
      if (LS.get(K_LAST, null) === id) LS.del(K_LAST);
    },
    login: function (id) {
      var a = G.accounts.byId(id);
      if (!a) return false;
      if (G.account) writeSave();
      G.account = a;
      G.profile = a.id;
      G.level = a.level;
      G.save = fillSave(LS.get(K_SAVE + id, blankSave()));
      LS.set(K_LAST, id);
      if (G.cloud && G.cloud.pull) G.cloud.pull();
      return true;
    },
    logout: function () {
      writeSave();
      G.hush();
      G.account = null; G.profile = null; G.save = blankSave();
      LS.del(K_LAST);
    },
    last: function () { return LS.get(K_LAST, null); }
  };

  /* ------------------------------------------------------------------ input */
  var pointer = { x: 0, y: 0, down: false, id: null };
  G.pointer = pointer;

  function toLogical(clientX, clientY) {
    var r = cv.getBoundingClientRect();
    return {
      x: (clientX - r.left - view.ox) / view.s,
      y: (clientY - r.top - view.oy) / view.s
    };
  }

  /* --------------------------------------------------- immediate-mode UI */
  var uiRects = [];       // registered this frame
  var uiHot = [];         // registered last frame (what the pointer tests against)
  var pressedKey = null;
  var ui = (G.ui = {});

  function rectKey(o) { return o.id || (o.label || '') + '|' + Math.round(o.x) + ',' + Math.round(o.y) + ',' + Math.round(o.w) + ',' + Math.round(o.h); }

  function shade(hex, amt) {
    var m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    if (!m) return hex;
    var f = function (h) { return G.clamp(Math.round(parseInt(h, 16) + amt), 0, 255); };
    var to = function (v) { return ('0' + v.toString(16)).slice(-2); };
    return '#' + to(f(m[1])) + to(f(m[2])) + to(f(m[3]));
  }
  G.shade = shade;

  ui.button = function (o) {
    var c = o.ctx || ctx;
    var key = rectKey(o);
    var down = pressedKey === key && !o.disabled;
    var r = o.r === undefined ? Math.min(26, o.h * .32) : o.r;
    var col = o.disabled ? '#b9ada0' : (o.color || G.C.leaf);
    var dy = down ? 5 : 0;

    c.save();
    c.globalAlpha = o.disabled ? .72 : 1;
    if (o.ghost) {
      // Invisible hit area over artwork drawn by the scene (e.g. a player card).
      if (down) {
        c.fillStyle = 'rgba(20,10,0,.14)';
        G.roundRect(c, o.x, o.y, o.w, o.h, r); c.fill();
      }
    } else {
      // base (the "3d" underside)
      c.fillStyle = shade(col, -48);
      G.roundRect(c, o.x, o.y + 7, o.w, o.h, r); c.fill();
      // face
      var g = c.createLinearGradient(0, o.y + dy, 0, o.y + o.h + dy);
      g.addColorStop(0, shade(col, 26)); g.addColorStop(1, col);
      c.fillStyle = g;
      G.roundRect(c, o.x, o.y + dy, o.w, o.h, r); c.fill();
      // gloss
      c.fillStyle = 'rgba(255,255,255,.20)';
      G.roundRect(c, o.x + o.w * .06, o.y + dy + o.h * .10, o.w * .88, o.h * .30, r * .7); c.fill();
    }

    var cx = o.x + o.w / 2, cy = o.y + dy + o.h / 2;
    if (o.icon) {
      var isz = o.iconSize || Math.min(o.w, o.h) * .52;
      o.icon(c, o.label ? o.x + o.h * .58 : cx, cy, isz);
    }
    if (o.label) {
      var tx = o.icon ? cx + o.h * .26 : cx;
      G.text(o.label, tx, o.sub ? cy - o.h * .12 : cy, {
        ctx: c, size: o.fontSize || Math.min(o.h * .40, 46),
        color: o.textColor || '#fff', stroke: o.outline || 'rgba(0,0,0,.22)',
        maxWidth: o.w - (o.icon ? o.h * .9 : o.w * .12)
      });
      if (o.sub) G.text(o.sub, tx, cy + o.h * .24, { ctx: c, size: o.h * .21, color: 'rgba(255,255,255,.9)', weight: 700 });
    }
    c.restore();

    if (!o.disabled) uiRects.push({ key: key, x: o.x, y: o.y, w: o.w, h: o.h, onTap: o.onTap, silent: o.silent, round: false });
    return down;
  };

  ui.round = function (o) {
    var c = o.ctx || ctx;
    var key = o.id || 'r' + Math.round(o.x) + ',' + Math.round(o.y);
    var down = pressedKey === key && !o.disabled;
    var col = o.disabled ? '#b9ada0' : (o.color || G.C.cream);
    var dy = down ? 4 : 0;
    c.save();
    c.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
    c.fillStyle = shade(col, -50);
    c.beginPath(); c.arc(o.x, o.y + 6, o.r, 0, 7); c.fill();
    c.fillStyle = col;
    c.beginPath(); c.arc(o.x, o.y + dy, o.r, 0, 7); c.fill();
    c.fillStyle = 'rgba(255,255,255,.25)';
    c.beginPath(); c.arc(o.x, o.y + dy - o.r * .22, o.r * .74, Math.PI, 0); c.fill();
    if (o.icon) o.icon(c, o.x, o.y + dy, o.r * 1.05);
    c.restore();
    if (!o.disabled) uiRects.push({ key: key, x: o.x - o.r, y: o.y - o.r, w: o.r * 2, h: o.r * 2, onTap: o.onTap, silent: o.silent, round: true, cx: o.x, cy: o.y, cr: o.r });
    return down;
  };

  function hitTest(p) {
    var i, r;
    for (i = uiHot.length - 1; i >= 0; i--) {
      r = uiHot[i];
      if (r.round) { if (G.dist(p.x, p.y, r.cx, r.cy) <= r.cr + 12) return r; }
      else if (p.x >= r.x - 6 && p.x <= r.x + r.w + 6 && p.y >= r.y - 6 && p.y <= r.y + r.h + 6) return r;
    }
    return null;
  }

  /* ----------------------------------------------------------------- scenes */
  var scenes = {};
  var cur = null, curName = '';
  var fade = { a: 0, dir: 0, next: null, params: null };
  G.current = '';

  G.scene = function (name, obj) { scenes[name] = obj; obj._name = name; return obj; };
  G.go = function (name, params) {
    if (!scenes[name]) { console.warn('scena assente:', name); return; }
    if (fade.dir === 1) return;                 // a transition is already under way
    fade.dir = 1; fade.next = name; fade.params = params || null;
    G.hush();
  };

     - l'anteprima è il KART, non il dino di profilo. Qui il dino esiste solo di
       spalle, e mostrarlo di lato sarebbe promettere un disegno che non c'è.
     - la domanda sull'età non apre giochi diversi, sceglie la DIFFICOLTÀ di

       menu quando si vuole.

       cielo notturno e la stessa striscia d'asfalto del menu.

   Il segreto è tre figure, non una password: un bambino di tre anni non sa
   scrivere ma ricorda benissimo "cuore, stella, luna". Non è sicurezza, è una
   serratura di famiglia — tiene due fratelli fuori dai progressi l'uno
   dell'altro, e nient'altro. */
(function () {
  'use strict';

  var C = G.C, W = G.W, H = G.H;
  var TAU = 6.2831853;

  var COLORS = [C.dino, C.blueberry, C.pinkPop, C.tangerine, C.plum, C.water];

  /* Le nove figure del segreto. Disegnate qui perché Dino Kart non porta con sé
     la libreria di forme di Dino Giungla, e nove forme sono più economiche di
     una dipendenza. Forma E colore insieme: un bambino che non distingue ancora
     un rombo da un quadrato distingue benissimo l'azzurro dal blu. */
  var KEYS = [
    { k: 'cerchio', col: C.berry },
    { k: 'quadrato', col: C.blueberry },
    { k: 'triangolo', col: C.mint },
    { k: 'cuore', col: C.pinkPop },
    { k: 'stella', col: C.sun },
    { k: 'fiore', col: C.plum },
    { k: 'luna', col: C.tangerine },
    { k: 'rombo', col: C.water },
    { k: 'quadrato', col: C.leafLight }
  ];

  function icon(c, x, y, r, i) {
    var s = KEYS[i % KEYS.length];
    var j;
    c.save();
    c.translate(x, y);
    c.beginPath();
    if (s.k === 'cerchio') {
      c.arc(0, 0, r, 0, TAU);
    } else if (s.k === 'quadrato') {
      G.roundRect(c, -r * 0.86, -r * 0.86, r * 1.72, r * 1.72, r * 0.24);
    } else if (s.k === 'triangolo') {
      c.moveTo(0, -r); c.lineTo(r * 0.92, r * 0.72); c.lineTo(-r * 0.92, r * 0.72); c.closePath();
    } else if (s.k === 'rombo') {
      c.moveTo(0, -r); c.lineTo(r, 0); c.lineTo(0, r); c.lineTo(-r, 0); c.closePath();
    } else if (s.k === 'cuore') {
      c.moveTo(0, r * 0.9);
      c.bezierCurveTo(-r * 1.5, -r * 0.15, -r * 0.55, -r * 1.15, 0, -r * 0.34);
      c.bezierCurveTo(r * 0.55, -r * 1.15, r * 1.5, -r * 0.15, 0, r * 0.9);
      c.closePath();
    } else if (s.k === 'stella') {
      for (j = 0; j < 10; j++) {
        var a = -Math.PI / 2 + j * Math.PI / 5;
        var rr = j % 2 ? r * 0.46 : r;
        if (j === 0) c.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
        else c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      c.closePath();
    } else if (s.k === 'luna') {
      c.arc(0, 0, r, Math.PI * 0.42, Math.PI * 1.58);
      c.arc(-r * 0.42, 0, r * 0.92, Math.PI * 1.52, Math.PI * 0.48, true);
      c.closePath();
    } else {                                   // fiore
      for (j = 0; j < 5; j++) {
        var b = -Math.PI / 2 + j * TAU / 5;
        c.moveTo(0, 0);
        c.arc(Math.cos(b) * r * 0.52, Math.sin(b) * r * 0.52, r * 0.48, 0, TAU);
      }
    }
    c.fillStyle = s.col; c.fill();
    c.strokeStyle = 'rgba(20,14,8,.55)'; c.lineWidth = Math.max(2, r * 0.12); c.stroke();
    c.restore();
  }

  /* Lo sfondo: lo stesso del menu, così passare dal profilo alla gara non
     sembra passare da un gioco a un altro. */
  function backdrop(c, title) {
    var sky = c.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#82cce5');
    sky.addColorStop(0.60, '#cde9d5');
    sky.addColorStop(1, '#f2d9a8');
    c.fillStyle = sky; c.fillRect(0, 0, W, H);
    c.fillStyle = '#d4bf95'; c.fillRect(0, H - 118, W, 118);
    c.strokeStyle = '#62594e'; c.lineWidth = 8;
    c.beginPath(); c.moveTo(0, H - 74); c.lineTo(W, H - 74); c.moveTo(0, H - 44); c.lineTo(W, H - 44); c.stroke();
    c.strokeStyle = '#8b765b'; c.lineWidth = 5;
    for (var i = 0; i < 26; i++) { c.beginPath(); c.moveTo(i * 52, H - 88); c.lineTo(i * 52, H - 30); c.stroke(); }
    if (title) {
      G.text(title, W / 2, 66, {
        ctx: c, size: 54, color: C.sun, stroke: 'rgba(12,20,40,.85)', strokeWidth: 12
      });
    }
  }

  function kartPreview(c, x, y, s, color, wob) {
    if (A.kartBack) {
      A.kartBack(c, x, y, s, { color: color, lean: Math.sin(G.t * 1.5 + (wob || 0)) * 0.3, bob: Math.sin(G.t * 3) * 0.5 });
      return;
    }
    c.fillStyle = color; c.fillRect(x - s / 2, y - s * 0.4, s, s * 0.4);
  }

  /* ------------------------------------------------------- scena: accesso */
  G.scene('accesso', {
    hud: false, back: false,

    enter: function () {
      var n = G.accounts.list().length;
      setTimeout(function () {
        if (G.current !== 'accesso') return;
        G.say(n ? 'Chi dirige la stazione oggi?' : 'Benvenuto! Facciamo il tuo capo stazione.');
      }, 460);
    },

    draw: function (c) {
      backdrop(c, 'Chi dirige la stazione?');

      var items = G.accounts.list().slice(0, 5);
      var n = items.length + 1;
      var cw = 210, gap = 22;
      var x0 = (W - (n * cw + (n - 1) * gap)) / 2, y = 150, ch = 340;

      items.forEach(function (a, i) {
        var x = x0 + i * (cw + gap);
        var wob = Math.sin(G.t * 1.6 + i) * 4;
        c.save();
        c.fillStyle = 'rgba(14,20,34,.55)';
        G.roundRect(c, x, y + wob, cw, ch, 26); c.fill();
        c.strokeStyle = 'rgba(255,246,224,.22)'; c.lineWidth = 2;
        G.roundRect(c, x, y + wob, cw, ch, 26); c.stroke();
        c.restore();

        kartPreview(c, x + cw / 2, y + wob + 210, 148, a.color, i);
        G.text(a.name, x + cw / 2, y + wob + 258, {
          ctx: c, size: 32, color: C.cream, maxWidth: cw - 24
        });

        c.save();
        c.fillStyle = a.level === 2 ? C.berry : C.mint;
        G.roundRect(c, x + cw / 2 - 58, y + wob + 282, 116, 32, 16); c.fill();
        c.restore();
        G.text(a.level === 2 ? 'Grande' : 'Piccolo', x + cw / 2, y + wob + 299, {
          ctx: c, size: 21, color: '#fff'
        });

        // il lucchetto: un puntino, non una spiegazione
        if (a.secret) {
          c.save(); c.globalAlpha = 0.9;
          icon(c, x + cw - 28, y + wob + 28, 13, 4);
          c.restore();
        }

        G.ui.button({
          id: 'acct' + a.id, x: x, y: y + wob, w: cw, h: ch, r: 26, ghost: true,
          onTap: function () {
            if (a.secret) G.go('segreto', { id: a.id });
            else { G.accounts.login(a.id); G.go('menu'); }
          }
        });
      });

      var xn = x0 + items.length * (cw + gap);
      var wn = Math.sin(G.t * 1.6 + items.length) * 4;
      G.ui.button({
        id: 'nuovo', x: xn, y: y + wn, w: cw, h: ch, r: 26, color: C.leaf,
        icon: function (cc, cx, cy) {
          cc.save();
          cc.strokeStyle = '#fff'; cc.lineWidth = 15; cc.lineCap = 'round';
          cc.beginPath();
          cc.moveTo(cx, cy - 92); cc.lineTo(cx, cy - 20);
          cc.moveTo(cx - 36, cy - 56); cc.lineTo(cx + 36, cy - 56);
          cc.stroke(); cc.restore();
        },
        onTap: function () { G.go('nuovo'); }
      });
      G.text('Nuovo', xn + cw / 2, y + wn + ch - 88, { ctx: c, size: 32, color: '#fff' });
      G.text('capo stazione', xn + cw / 2, y + wn + ch - 52, { ctx: c, size: 24, color: '#fff' });

      if (items.length) {
        G.ui.round({
          id: 'gestisci', x: W - 54, y: H - 50, r: 28, color: 'rgba(255,246,224,.5)',
          icon: function (cc, x, yy, r) {
            cc.save(); cc.fillStyle = C.ink;
            for (var i = 0; i < 8; i++) {
              var a = i * Math.PI / 4 + G.t * 0.4;
              cc.save();
              cc.translate(x + Math.cos(a) * r * 0.5, yy + Math.sin(a) * r * 0.5);
              cc.rotate(a); cc.fillRect(-3, -5, 10, 10); cc.restore();
            }
            cc.beginPath(); cc.arc(x, yy, r * 0.32, 0, TAU); cc.fill();
            cc.fillStyle = 'rgba(255,246,224,.9)';
            cc.beginPath(); cc.arc(x, yy, r * 0.13, 0, TAU); cc.fill();
            cc.restore();
          },
          onTap: function () { G.go('gate'); }
        });
      }
    }
  });

  /* ------------------------------------------------------- scena: segreto */
  var sg = { id: null, taps: [], shake: 0, fails: 0 };

  G.scene('segreto', {
    hud: false, back: false,
    enter: function (p) {
      sg.id = p && p.id; sg.taps = []; sg.shake = 0; sg.fails = 0;
      var a = G.accounts.byId(sg.id);
      setTimeout(function () {
        if (G.current !== 'segreto') return;
        G.say('Ciao ' + (a ? a.name : '') + '! Tocca il tuo segreto.');
      }, 400);
    },
    update: function (dt) { if (sg.shake > 0) sg.shake = Math.max(0, sg.shake - dt * 4); },
    draw: function (c) {
      var a = G.accounts.byId(sg.id);
      if (!a) { G.go('accesso'); return; }
      backdrop(c, null);

      kartPreview(c, 250, 520, 200, a.color, 0);
      G.text('Ciao ' + a.name + '!', 250, 178, {
        ctx: c, size: 48, color: C.sun, stroke: 'rgba(12,20,40,.8)', strokeWidth: 11
      });
      G.text('Tocca il tuo segreto', 250, 232, {
        ctx: c, size: 27, color: C.cream, weight: 700
      });

      var i;
      for (i = 0; i < 3; i++) {
        var sx = 250 + (i - 1) * 74, sy = 290;
        c.save();
        c.fillStyle = 'rgba(255,246,224,.24)';
        c.beginPath(); c.arc(sx, sy, 27, 0, TAU); c.fill();
        c.restore();
        if (sg.taps[i] !== undefined) icon(c, sx, sy, 21, sg.taps[i]);
      }

      var px = 690, py = 132, cell = 148, gap = 14;
      var jitter = sg.shake > 0 ? Math.sin(G.t * 50) * sg.shake * 10 : 0;
      for (i = 0; i < 9; i++) {
        (function (idx) {
          var bx = px + (idx % 3) * (cell + gap) + jitter;
          var by = py + Math.floor(idx / 3) * (cell + gap);
          G.ui.button({
            id: 'sk' + idx, x: bx, y: by, w: cell, h: cell, r: 24, color: C.cream,
            icon: function (cc, cx, cy) { icon(cc, cx, cy, cell * 0.29, idx); },
            onTap: function () {
              sg.taps.push(idx);
              G.sfx('pop');
              if (sg.taps.length < 3) return;
              var ok = a.secret && a.secret.length === 3 &&
                a.secret.every(function (v, k) { return v === sg.taps[k]; });
              if (ok) {
                G.sfx('good');
                G.accounts.login(a.id);
                G.go('menu');
              } else {
                sg.fails++; sg.shake = 1; sg.taps = [];
                G.sfx('bad'); G.shake(6);
                G.say(G.pick(['Ops! Riprova.', 'Non e questo, riprova!', 'Ancora una volta.']));
              }
            }
          });
        })(i);
      }

      G.ui.button({
        x: 40, y: H - 104, w: 240, h: 82, r: 24, color: C.bark, label: 'Indietro',
        onTap: function () { G.go('accesso'); }
      });
      /* Dopo tre tentativi appare la via d'uscita, dietro al cancello dei
         grandi: un bambino che ha dimenticato il segreto non deve restare
         chiuso fuori dal proprio gioco. */
      if (sg.fails >= 3) {
        G.ui.button({
          x: 300, y: H - 104, w: 320, h: 82, r: 24, color: C.tangerine,
          label: 'Chiedi a un grande', fontSize: 26,
          onTap: function () { G.go('gate', { then: '@login', arg: a.id, back: 'segreto', backArg: { id: a.id } }); }
        });
      }
    }
  });

  /* --------------------------------------------------------- scena: nuovo */
  var nu = { step: 0, name: '', color: COLORS[0], level: 1, secret: [] };

  G.scene('nuovo', {
    hud: false, back: false,
    enter: function () {
      nu = { step: 0, name: '', color: COLORS[0], level: 1, secret: [] };
      G.prompt('Come ti chiami?', '', function (v) {
        if (!v) { G.go('accesso'); return; }
        nu.name = v.slice(0, 14);
        nu.step = 1;
        G.say('Ciao ' + nu.name + '! Di che colore è la tua locomotiva?');
      });
    },
    draw: function (c) {
      var titles = ['', 'Di che colore è la locomotiva?', 'Quanti anni hai?', 'Scegli il tuo segreto'];
      backdrop(c, titles[nu.step] || '');
      var i;

      if (nu.step === 1) {
        kartPreview(c, W / 2, 470, 250, nu.color, 0);
        G.text(nu.name, W / 2, 520, { ctx: c, size: 38, color: C.cream });
        var bw = 128, bg = 18;
        var x0 = (W - (COLORS.length * bw + (COLORS.length - 1) * bg)) / 2;
        COLORS.forEach(function (col, k) {
          G.ui.button({
            id: 'col' + k, x: x0 + k * (bw + bg), y: 140, w: bw, h: 116, r: 24, color: col,
            icon: function (cc, cx, cy) {
              if (nu.color !== col) return;
              cc.save();
              cc.strokeStyle = '#fff'; cc.lineWidth = 8; cc.lineCap = 'round'; cc.lineJoin = 'round';
              cc.beginPath();
              cc.moveTo(cx - 22, cy); cc.lineTo(cx - 6, cy + 18); cc.lineTo(cx + 24, cy - 18);
              cc.stroke(); cc.restore();
            },
            onTap: function () { nu.color = col; G.sfx('pop'); }
          });
        });
        G.ui.button({
          x: W / 2 - 180, y: H - 112, w: 360, h: 88, r: 26, color: C.leaf, label: 'Avanti',
          onTap: function () { nu.step = 2; G.say('Quanti anni hai?'); }
        });
      }

      if (nu.step === 2) {
        /* L'eta non apre giochi diversi: sceglie da quale difficolta si parte.
           Piu onesto che inventare due modalita che poi non esistono. */
        [{ lv: 1, t: 'Piccolo', s: '3 - 4 anni', col: C.mint, d: 'Un treno alla volta, con tanti aiuti' },
         { lv: 2, t: 'Grande', s: '5 - 7 anni', col: C.berry, d: 'Più binari e coincidenze da organizzare' }]
          .forEach(function (o, k) {
            var x = W / 2 - 340 + k * 360;
            G.ui.button({
              id: 'lv' + o.lv, x: x, y: 160, w: 320, h: 280, r: 30,
              color: nu.level === o.lv ? o.col : G.shade(o.col, -60),
              label: o.t, sub: o.s, fontSize: 50,
              onTap: function () { nu.level = o.lv; G.sfx('pop'); }
            });
            G.text(o.d, x + 160, 476, { ctx: c, size: 22, color: C.cream, weight: 700 });
          });
        G.ui.button({
          x: W / 2 - 180, y: H - 112, w: 360, h: 88, r: 26, color: C.leaf, label: 'Avanti',
          onTap: function () { nu.step = 3; G.say('Scegli tre figure: sara il tuo segreto.'); }
        });
      }

      if (nu.step === 3) {
        G.text('Tocca 3 figure e ricordale bene', W / 2, 118, {
          ctx: c, size: 26, color: C.cream, weight: 700
        });
        for (i = 0; i < 3; i++) {
          var sx = W / 2 + (i - 1) * 88, sy = 176;
          c.save(); c.fillStyle = 'rgba(255,246,224,.24)';
          c.beginPath(); c.arc(sx, sy, 31, 0, TAU); c.fill(); c.restore();
          if (nu.secret[i] !== undefined) icon(c, sx, sy, 24, nu.secret[i]);
        }
        var px = W / 2 - 232, py = 228, cell = 138, gap = 16;
        for (i = 0; i < 9; i++) {
          (function (idx) {
            var bx = px + (idx % 3) * (cell + gap), by = py + Math.floor(idx / 3) * (cell + gap);
            G.ui.button({
              id: 'nk' + idx, x: bx, y: by, w: cell, h: cell, r: 24, color: C.cream,
              disabled: nu.secret.length >= 3,
              icon: function (cc, cx, cy) { icon(cc, cx, cy, cell * 0.28, idx); },
              onTap: function () { nu.secret.push(idx); G.sfx('pop'); }
            });
          })(i);
        }
        G.ui.button({
          x: 34, y: H - 112, w: 240, h: 88, r: 26, color: C.bark, label: 'Rifai', fontSize: 32,
          onTap: function () { nu.secret = []; }
        });
        G.ui.button({
          x: W - 274, y: H - 112, w: 240, h: 88, r: 26, color: '#5a6472',
          label: 'Senza segreto', fontSize: 22,
          onTap: function () { nu.secret = []; finish(); }
        });
        if (nu.secret.length === 3) {
          G.ui.button({
            x: W / 2 - 160, y: H - 112, w: 320, h: 88, r: 26, color: C.leaf, label: 'Fatto!',
            onTap: finish
          });
        }
      }
    }
  });

  function finish() {
    var a = G.accounts.create({
      name: nu.name, color: nu.color, level: nu.level,
      secret: nu.secret.length === 3 ? nu.secret : null
    });
    G.accounts.login(a.id);
    /* L'eta scelta diventa la difficolta di partenza, una volta sola: da qui in
       poi comanda il menu, perche un bambino cresce piu in fretta di quanto si
       rifaccia un profilo. */
    G.fx.confetti(); G.sfx('win');
    G.go('menu');
    setTimeout(function () { G.say('Tutti in carrozza, ' + a.name + '!'); }, 900);
  }

  /* ---------------------------------------------------------- scena: gate */
  /* Il cancello dei grandi: una moltiplicazione a due cifre. Non e sicurezza,
     e un attrito che un bambino di sei anni non supera per sbaglio. */
  var gt = { a: 0, b: 0, typed: '', then: 'gestione', arg: null, back: 'accesso', backArg: null, shake: 0 };

  G.scene('gate', {
    hud: false, back: false,
    enter: function (p) {
      p = p || {};
      gt.a = G.rndi(6, 9); gt.b = G.rndi(6, 9);
      gt.typed = ''; gt.shake = 0;
      gt.then = p.then || 'gestione'; gt.arg = p.arg || null;
      gt.back = p.back || 'accesso'; gt.backArg = p.backArg || null;
    },
    update: function (dt) { if (gt.shake > 0) gt.shake = Math.max(0, gt.shake - dt * 4); },
    draw: function (c) {
      backdrop(c, null);
      G.text('Solo per i grandi', W / 2, 74, {
        ctx: c, size: 46, color: C.cream, stroke: 'rgba(12,20,40,.8)', strokeWidth: 10
      });

      var j = gt.shake > 0 ? Math.sin(G.t * 48) * gt.shake * 12 : 0;
      c.save();
      c.fillStyle = 'rgba(14,20,34,.6)';
      G.roundRect(c, 150 + j, 160, 440, 290, 26); c.fill();
      c.restore();
      G.text(gt.a + ' x ' + gt.b + ' = ?', 370 + j, 246, { ctx: c, size: 66, color: C.sun });
      c.save();
      c.fillStyle = 'rgba(255,246,224,.9)';
      G.roundRect(c, 210 + j, 312, 320, 92, 20); c.fill(); c.restore();
      G.text(gt.typed || '-', 370 + j, 358, { ctx: c, size: 54, color: C.ink });

      var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', 'OK'];
      var kx = 690, ky = 150, kw = 148, kh = 112, kg = 14;
      keys.forEach(function (k, i) {
        G.ui.button({
          id: 'g' + k, x: kx + (i % 3) * (kw + kg), y: ky + Math.floor(i / 3) * (kh + kg),
          w: kw, h: kh, r: 22,
          color: k === 'OK' ? C.leaf : k === 'C' ? C.berry : C.cream,
          textColor: (k === 'OK' || k === 'C') ? '#fff' : C.ink,
          label: k, fontSize: 42,
          onTap: function () {
            if (k === 'C') { gt.typed = ''; return; }
            if (k === 'OK') {
              if (parseInt(gt.typed, 10) === gt.a * gt.b) {
                G.sfx('good');
                if (gt.then === '@login') { G.accounts.login(gt.arg); G.go('menu'); }
                else G.go(gt.then, gt.arg);
              } else { gt.shake = 1; gt.typed = ''; G.sfx('bad'); }
              return;
            }
            if (gt.typed.length < 3) gt.typed += k;
          }
        });
      });

      G.ui.button({
        x: 150, y: H - 100, w: 280, h: 80, r: 24, color: C.bark, label: 'Annulla',
        onTap: function () { G.go(gt.back, gt.backArg); }
      });
    }
  });

  /* ------------------------------------------------------ scena: gestione */
  var gs = { sel: 0, confirm: 0 };

  G.scene('gestione', {
    hud: false, back: false,
    enter: function () { gs.sel = 0; gs.confirm = 0; },
    update: function (dt) { if (gs.confirm > 0) gs.confirm = Math.max(0, gs.confirm - dt); },
    draw: function (c) {
      backdrop(c, 'Piloti');
      var list = G.accounts.list();
      if (!list.length) { G.go('accesso'); return; }
      if (gs.sel >= list.length) gs.sel = 0;
      var a = list[gs.sel];

      // la fila dei piloti, per scegliere su chi si sta lavorando
      var cw = 128, gap = 14;
      var x0 = (W - (list.length * cw + (list.length - 1) * gap)) / 2;
      list.forEach(function (p, i) {
        G.ui.button({
          id: 'sel' + p.id, x: x0 + i * (cw + gap), y: 116, w: cw, h: 116, r: 22,
          color: i === gs.sel ? p.color : G.shade(p.color, -70),
          label: p.name, fontSize: 22,
          onTap: function () { gs.sel = i; gs.confirm = 0; G.sfx('pop'); }
        });
      });

      kartPreview(c, 300, 470, 200, a.color, 0);

/* ==================== 10-stazione.js ==================== */
/* Il gioco: instrada i treni, libera i binari e dà il via alle partenze. */
(function () {
  'use strict';
  var C = G.C, W = G.W, H = G.H;
  var TRACK_Y = [312, 454, 596];
  var TRACK_COL = [C.sun, C.water, C.leafLight];
  var TRACK_NAME = ['Sole', 'Mare', 'Bosco'];
  /* Una regola nuova alla volta: binari, coda e direzione arrivano gradualmente. */
  var LEVELS = [
    { tracks: 1, total: 3, maxIncoming: 1 }, { tracks: 2, total: 3, maxIncoming: 1 },
    { tracks: 2, total: 4, maxIncoming: 1 }, { tracks: 3, total: 4, maxIncoming: 1 },
    { tracks: 3, total: 5, cross: true, maxIncoming: 1 }, { tracks: 3, total: 5, cross: true, both: true, maxIncoming: 1 },
    { tracks: 3, total: 6, cross: true, both: true, maxIncoming: 2 }, { tracks: 3, total: 6, cross: true, both: true, maxIncoming: 2 },
    { tracks: 3, total: 7, cross: true, both: true, maxIncoming: 2 }, { tracks: 3, total: 7, cross: true, both: true, maxIncoming: 3 },
    { tracks: 3, total: 8, cross: true, both: true, maxIncoming: 3 }, { tracks: 3, total: 8, cross: true, both: true, maxIncoming: 3 }
  ];
  var MAX_LEVEL = LEVELS.length;
  var S = {};

  function setup(level) {
    level = G.clamp(level || 1, 1, MAX_LEVEL);
    var plan = LEVELS[level - 1];
    var n = plan.tracks, total = plan.total;
    S = {
      level: level, tracks: n, total: total, schedule: [], next: 0, switchA: 0, switchB: 0,
      active: [], focus: null, occupied: [null, null, null], departing: [],
      arrived: 0, departed: 0, mistakes: 0, waits: 0, collisions: 0, hint: -1, idle: 0,
      message: 'Tocca il trenino', fine: false, reward: false, plan: plan
    };
    var last = -1;
    for (var i = 0; i < total; i++) {
      var target = G.rndi(0, n - 1);
      if (n > 1 && target === last && i % 2) target = (target + 1) % n;
      S.schedule.push({ target: target, dir: 1, id: i });
      last = target;
    }
    spawn();
  }

  function spawn() {
    if (S.next >= S.schedule.length || S.fine || S.active.length >= S.plan.maxIncoming) return;
    if (S.plan.maxIncoming === 1 && S.occupied.some(function (v) { return !!v; })) return;
    var q = S.schedule[S.next++], lane = 0;
    while(S.active.some(function(t){return t.lane===lane;})) lane++;
    S.active.push({
      target: q.target, dir: q.dir, id: q.id, phase: 'choose', p: 0,
      x: q.dir === 1 ? 118 : W - 118, y: 238 + lane * 148, sourceY: 238 + lane * 148, lane: lane,
      color: TRACK_COL[q.target]
    });
    S.message = S.active.length > 1 ? 'Scegli un trenino da preparare' : 'Tocca il trenino per guardare dove va';
    S.idle = 0; S.hint = -1;
    if (S.level === 1) setTimeout(function () { if (G.current === 'stazione' && S.active.length) G.say('Tocca il trenino!'); }, 300);
  }

  function fillIncoming() {
    while (!S.fine && S.next < S.schedule.length && S.active.length < S.plan.maxIncoming) {
      var before = S.active.length; spawn();
      if (S.active.length === before) break;
    }
  }

  function focusedTrain() {
    for (var i = 0; i < S.active.length; i++) if (S.active[i].id === S.focus) return S.active[i];
    for (var j = 0; j < S.active.length; j++) if (S.active[j].phase === 'choose-route') return S.active[j];
    return null;
  }

  function trackFreeFor(t) {
    if (S.occupied[t.target] || S.departing.some(function(d){return d.target===t.target;})) return false;
    for (var i = 0; i < S.active.length; i++) {
      var other = S.active[i];
      /* L'incrocio e' una risorsa unica: un solo convoglio lo attraversa,
         gli altri restano visibili in attesa del loro verde. */
      if (other !== t && other.phase === 'moving') return false;
      if (other !== t && other.target === t.target &&
          (other.phase === 'moving' || (other.phase === 'waiting' && other.id < t.id))) return false;
    }
    return true;
  }

  function startMoving(t) {
    t.phase = 'moving'; t.p = 0; S.hint = -1;
    S.message = 'Via libera: ' + TRACK_NAME[t.target] + ' passa per primo'; G.sfx('good');
  }

  function choose(track) {
    var t = focusedTrain();
    if (!t || t.phase !== 'choose-route' || S.fine) return false;
    S.idle = 0;
    if (track !== t.target) {
      S.mistakes++; S.hint = t.target; S.message = 'Quasi! Cerca il simbolo ' + TRACK_NAME[t.target];
      G.sfx('pop'); G.fx.text(205, TRACK_Y[track] || 330, '↩', C.tangerine, 54);
      G.say('Quasi! Cerca ' + TRACK_NAME[t.target] + '.');
      return false;
    }
    S.focus = null;
    if (trackFreeFor(t)) {
      startMoving(t);
      return true;
    }
    if (!t.wasWaiting) { t.wasWaiting = true; S.waits++; }
    t.phase = 'waiting'; S.hint = track;
    S.message = 'Binario occupato: questo trenino aspetta il suo turno'; G.sfx('chime');
    return true;
  }

  /* Il treno e' sempre il primo bersaglio: da lui si apre la scelta del
     binario e da lui riparte quando i passeggeri sono pronti. */
  function tapTrain(t, track) {
    if (S.fine || !t) return false;
    S.idle = 0;
    if (S.active.indexOf(t) >= 0) {
      if (t.phase === 'choose') {
        t.phase = 'choose-route'; S.focus = t.id; S.hint = -1;
        S.message = 'Prepara gli scambi, poi dai il via'; G.sfx('tap');
        G.say('Destinazione ' + TRACK_NAME[t.target] + '. Prepara gli scambi e tocca via.');
        return true;
      }
      if (t.phase === 'choose-route') {
        S.focus = t.id; S.message = 'Segui il binario illuminato. Dove arriverà?'; S.hint = -1;
        return true;
      }
      if (t.phase === 'waiting') {
        if(trackFreeFor(t)){startMoving(t);return true;}
        S.message = 'Libera prima il binario: fai partire il treno fermo'; G.say(S.message);
        return true;
      }
      return false;
    }
    if (track !== undefined && S.occupied[track] === t) {
      if (!t.ready) { S.message = 'Aspettiamo un attimo i passeggeri'; G.sfx('tap'); return true; }
      return depart(track);
    }
    return false;
  }

  function depart(track) {
    var t = S.occupied[track];
    if (!t || !t.ready || S.fine) {
      if (t) { S.message = 'Aspettiamo che salgano tutti'; G.sfx('tap'); }
      return false;
    }
    S.occupied[track] = null; t.phase = 'departing'; t.p = 0;
    S.departing.push(t); S.departed++; S.message = 'Via libera! Buon viaggio!';
    G.sfx('win'); G.fx.confetti(1080, TRACK_Y[track], TRACK_COL[track], 12);
    for (var i = 0; i < S.active.length; i++) {
      if (S.active[i].phase === 'waiting') S.message = 'Ora guarda il segnale e dai il via al treno in attesa';
    }
    fillIncoming();
    checkDone();
    return true;
  }

  function checkDone() {
    if (S.departed < S.total || S.departing.length || S.active.length || S.occupied.some(function (v) { return !!v; })) return;
    S.fine = true; S.message = 'Turno completato! Tutti i treni sono partiti';
    if (!S.reward) {
      S.reward = true;
      var save = G.stationSave(); save.served += S.total;
      save.maxLevel = Math.max(save.maxLevel, Math.min(MAX_LEVEL, S.level + 1));
      save.best[S.level] = Math.min(save.best[S.level] === undefined ? 999 : save.best[S.level], S.mistakes);
      G.saveNow(); G.addStars(1, W / 2, 250); G.addFruits(4 + S.level, W / 2, 300);
      G.fx.confetti(W / 2, 330, C.sun, 48); G.sfx('win'); G.say('Bravissimo! Tutti i treni sono partiti.');
    }
  }

  function update(dt) {
    if (S.fine) return;
    S.idle += dt;
    updateTrains(dt);
  }

  function updateTrains(dt) {
    S.active.forEach(function (a) {
      if (a.phase === 'choose' && S.idle > (S.level === 1 ? 2.6 : 4.5)) S.hint = -2;
      if (a.phase === 'choose-route' && S.focus === a.id && S.idle > (G.level===1?7:12)) S.hint = a.target;
      if (a.phase === 'waiting' && trackFreeFor(a)) S.message = 'Via libera! Tocca il treno in attesa';
    });
    for (var ai = S.active.length - 1; ai >= 0; ai--) {
      var a = S.active[ai];
      if (a.phase !== 'moving') continue;
      a.p += dt / 1.15;
      var point = routePoint(a.target, G.clamp(a.p,0,1), a.sourceY);
      a.x = point.x; a.y = point.y;
      if (a.p >= 1) {
        a.x = 820; a.y = TRACK_Y[a.target]; a.phase = 'parked'; a.dwell = S.level === 1 ? .45 : .8; a.ready = false;
        S.occupied[a.target] = a; S.active.splice(ai, 1); S.arrived++;
        if (S.focus === a.id) S.focus = null;
        S.message = 'Aspettiamo i passeggeri...';
      }
    }
    S.occupied.forEach(function (t, i) {
      if (!t || t.ready) return;
      t.dwell -= dt;
      if (t.dwell <= 0) {
        t.ready = true; S.message = 'Passeggeri pronti! Tocca il trenino per farlo partire'; G.sfx('chime');
        if (S.level === 1) G.say('Passeggeri pronti! Tocca il trenino.');
      }
    });
    for (var i = S.departing.length - 1; i >= 0; i--) {
      var d = S.departing[i]; d.p += dt / 1.05;
      d.x = G.lerp(820, d.dir === 1 ? W + 180 : -180, G.easeIn(d.p));
      if (d.p >= 1) S.departing.splice(i, 1);
    }
    fillIncoming();
    checkDone();
  }

  function selectedRoute(){return S.tracks===1?0:(S.switchA===0?0:(S.tracks===2?1:1+S.switchB));}
  function launch(){return choose(selectedRoute());}
  function toggleSwitch(which){
    if(S.fine || S.active.some(function(t){return t.phase==='moving';}))return;
    if(which===0)S.switchA=1-S.switchA;else S.switchB=1-S.switchB;
    S.idle=0;S.hint=-1;G.sfx('tap');
  }
  // Every moving train follows the very same geometry as the visible rails.
  function routePoint(target,p,sourceY){
    var x,y,t;
    if(p<.32){t=p/.32;x=G.lerp(118,330,t);y=G.lerp(sourceY,312,G.easeInOut(t));}
    else if(p<.65){t=(p-.32)/.33;x=G.lerp(330,530,t);y=G.lerp(312,target===0?312:454,G.easeInOut(t));}
    else{t=(p-.65)/.35;x=G.lerp(530,820,t);y=G.lerp(target===0?312:454,TRACK_Y[target],G.easeInOut(t));}
    return{x:x,y:y};
  }
  function railPath(c,target,sourceY){
    c.beginPath();for(var j=0;j<=40;j++){var q=routePoint(target,j/40,sourceY);if(j)c.lineTo(q.x,q.y);else c.moveTo(q.x,q.y);}c.lineTo(1280,TRACK_Y[target]);
  }
  function rails(c) {
    c.fillStyle='#aac690';c.fillRect(0,218,W,H-218);
    c.fillStyle='#7baf82';for(var bush=0;bush<9;bush++){c.beginPath();c.ellipse(245+bush*128,680,48,24,0,0,7);c.fill();}
    for(var i=0;i<S.tracks;i++){
      c.lineCap='round';railPath(c,i,238);c.strokeStyle='#b4a185';c.lineWidth=34;c.stroke();
      railPath(c,i,238);c.strokeStyle='#5a615d';c.lineWidth=20;c.stroke();
      railPath(c,i,238);c.strokeStyle='#e0d6bd';c.lineWidth=12;c.stroke();
      c.fillStyle='#f7ebd1';G.roundRect(c,738,TRACK_Y[i]-51,300,86,20);c.fill();
      c.fillStyle='#aa8663';c.fillRect(750,TRACK_Y[i]+33,275,8);
      A.destination(c,982,TRACK_Y[i]-16,27,i);
    }
    var selected=selectedRoute();
    c.save();railPath(c,selected,238);c.strokeStyle='#ffdc78';c.lineWidth=6;c.stroke();c.restore();
    // Waiting sidings reconnect to the first switch, never float over scenery.
    S.active.forEach(function(t){if(t.lane){railPath(c,selected,t.sourceY);c.strokeStyle='#687269';c.lineWidth=4;c.stroke();}});
    G.text('1',330,282,{size:22,color:C.ink});if(S.tracks>2)G.text('2',530,425,{size:22,color:C.ink});
  }

  function draw(c) {
    A.stationSky(c); rails(c);
    G.text('Turno ' + S.level, 34, 114, { ctx: c, size: 28, align: 'left', color: C.ink });
    G.text((S.departed) + ' / ' + S.total + ' partiti', 34, 151, { ctx: c, size: 21, align: 'left', color: C.ink });
    c.fillStyle = 'rgba(255,246,224,.94)'; G.roundRect(c, 310, 154, 660, 62, 24); c.fill();
    G.text(S.message, 640, 185, { ctx: c, size: 25, color: C.ink, maxWidth: 620 });

    var routing=!!focusedTrain(), locked=S.active.some(function(t){return t.phase==='moving';});
    function lever(which,x,y,value){c.strokeStyle='#647364';c.lineWidth=3;c.setLineDash([5,7]);c.beginPath();c.moveTo(x,y-48);c.lineTo(x,which===0?326:468);c.stroke();c.setLineDash([]);G.ui.button({id:'switch-'+which,x:x-52,y:y-48,w:104,h:96,r:26,color:locked?'#a4ada2':C.cream,disabled:locked,
      icon:function(cc,cx,cy){cc.strokeStyle=C.ink;cc.lineWidth=7;cc.lineCap='round';cc.beginPath();cc.moveTo(cx,cy+20);cc.lineTo(cx+(value?24:-24),cy-22);cc.stroke();cc.fillStyle=C.tangerine;cc.beginPath();cc.arc(cx+(value?24:-24),cy-22,14,0,7);cc.fill();},
      onTap:function(){toggleSwitch(which);}});}
    if(S.tracks>1)lever(0,330,410,S.switchA);
    if(S.tracks>2)lever(1,530,563,S.switchB);
    G.ui.button({id:'station-go',x:1060,y:112,w:180,h:104,r:28,color:C.leaf,label:'VIA',disabled:!routing,onTap:launch});
    for(var sig=0;sig<S.tracks;sig++)A.signal(c,1120,TRACK_Y[sig]-20,30,!!(S.occupied[sig]&&S.occupied[sig].ready));
    S.occupied.forEach(function (t, idx) {
      if (!t) return;
      A.train(c, t.x, t.y, 100, { color: t.color, kind: t.target, dir: t.dir });
      G.ui.button({ id: 'parked-' + idx, x: t.x - 92, y: t.y - 86, w: 184, h: 148, r: 54, ghost: true,
        onTap: function () { tapTrain(t, idx); } });
      if (t.ready) {
        c.save(); c.globalAlpha = .55 + .35 * Math.sin(G.t * 6); c.strokeStyle = C.mint; c.lineWidth = 6;
        c.beginPath(); c.arc(t.x, t.y - 12, 92, 0, 7); c.stroke(); c.restore();
      }
    });
    S.departing.forEach(function (t) { A.train(c, t.x, t.y, 100, { color: t.color, kind: t.target, dir: t.dir }); });
    S.active.forEach(function (t) {
      A.train(c, t.x, t.y, 100, { color: t.color, kind: t.target, dir: t.dir });
      G.ui.button({ id: 'active-train-' + t.id, x: t.x - 92, y: t.y - 86, w: 184, h: 148, r: 54, ghost: true,
        onTap: function () { tapTrain(t); } });
      if (t.phase === 'choose') {
        c.save(); c.globalAlpha = .55 + .35 * Math.sin(G.t * 6); c.strokeStyle = C.sun; c.lineWidth = 7;
        c.beginPath(); c.arc(t.x, t.y - 10, 94, 0, 7); c.stroke(); c.restore();
      }
      if (t.phase === 'waiting') {
        c.save(); c.globalAlpha = .8; c.strokeStyle = C.tangerine; c.lineWidth = 6;
        c.beginPath(); c.arc(t.x, t.y - 10, 88, 0, 7); c.stroke(); c.restore();
      }
    });

    if (S.fine) {
      c.fillStyle = 'rgba(31,55,42,.80)'; c.fillRect(0, 0, W, H);
      c.fillStyle = C.cream; G.roundRect(c, 280, 130, 720, 460, 42); c.fill();
      G.text('Stazione perfetta!', W / 2, 222, { ctx: c, size: 55, color: C.leafDark });
      A.train(c, W / 2, 350, 185, { color: G.account.color, kind: S.level % 3 });
      G.text(S.mistakes ? 'Abbiamo corretto insieme ' + S.mistakes + ' scambi' : 'Tutti gli scambi al primo colpo!', W / 2, 455, { ctx: c, size: 27, color: C.ink });
      G.ui.button({ id: 'again', x: 205, y: 500, w: 245, h: 76, r: 24, color: C.water, label: 'Riprova', onTap: function () { setup(S.level); } });
      if (S.level < MAX_LEVEL) {
        G.ui.button({ id: 'next', x: 518, y: 500, w: 245, h: 76, r: 24, color: C.leaf, label: 'Prossimo!',
          onTap: function () { var save = G.stationSave(); save.level = S.level + 1; G.saveNow(); setup(S.level + 1); } });
      }
      G.ui.button({ id: 'menu', x: S.level < MAX_LEVEL ? 830 : 518, y: 500, w: 245, h: 76, r: 24, color: C.tangerine, label: 'Deposito', onTap: function () { G.go('menu'); } });
    }
  }

  G.stationState = function () {
    var focused = focusedTrain() || S.active[0];
    return {
      level: S.level, tracks: S.tracks, total: S.total, next: S.next, route: selectedRoute(), switches:[S.switchA,S.switchB],
      cross: !!S.plan.cross, maxIncoming: S.plan.maxIncoming,
      active: focused && { id: focused.id, target: focused.target, phase: focused.phase },
      actives: S.active.map(function (t) { return { id: t.id, target: t.target, phase: t.phase }; }),
      activeCount: S.active.length,
      moving: S.active.filter(function (t) { return t.phase === 'moving'; }).length,
      waiting: S.active.filter(function (t) { return t.phase === 'waiting'; }).length,
      occupied: S.occupied.map(function (t) { return t && { ready: t.ready, target: t.target }; }),

  G.stationDepart = depart;
  G.stationTapTrain = function (id) {
    for (var a = 0; a < S.active.length; a++) {

    for (var i = 0; i < S.occupied.length; i++) if (S.occupied[i]) return tapTrain(S.occupied[i], i);

  };

  G.scene('stazione', {
    hud: true,
    enter: function (p) { setup((p && p.level) || G.stationSave().level || 1); },

  });

/* ==================== 92-family-account.js ==================== */
/* Accounts: who is playing. Each child gets their own dino, their own save and
   an optional 3-icon "secret" instead of a password — a 3-year-old cannot type
   but can absolutely remember "cuore, stella, luna".
   This is a family lock, not security: it keeps two siblings out of each
   other's progress, nothing more. */
(function () {
  'use strict';

  var C = G.C, W = G.W, H = G.H;

    { shape: 'triangolo', color: C.mint, name: 'triangolo verde' },
    { shape: 'cuore', color: C.pinkPop, name: 'cuore rosa' },
    { shape: 'stella', color: C.sun, name: 'stella gialla' },
    { shape: 'fiore', color: C.plum, name: 'fiore viola' },
    { shape: 'luna', color: C.tangerine, name: 'luna arancione' },
    { shape: 'rombo', color: C.water, name: 'rombo azzurro' },
    { shape: 'quadrato', color: C.leafLight, name: 'quadrato verde' }

    c.save(); c.fillStyle = k.color; c.strokeStyle = C.ink; c.lineWidth = 4;
    c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); c.stroke(); c.restore();

  /* `gear` is a look object from G.look (see 01c-art-gear.js). Pass one when
     drawing SOMEBODY ELSE'S dino; pass nothing for the current player and
     A.dino resolves the current save itself.
     Every account gets its OWN buffer — this screen draws up to five dinos in
     a single frame, and a shared one would put the last child's hat on all of
     them. To a three-year-old that is not a glitch, that is a theft. */

  }

  function backdrop(c, title) {

    c.save();
    c.fillStyle = 'rgba(10,32,20,.34)';
    c.fillRect(0, 0, W, H);
    c.restore();
    if (title) G.text(title, W / 2, 78, { size: 60, color: C.cream, stroke: 'rgba(12,40,25,.75)', strokeWidth: 12 });
    if (window.A && A.canopy) A.canopy(c, G.t);

  /* ------------------------------------------------------- scene: accesso */
  var accountPage = 0;
  var lookCache = {};     // account id -> its OWN look buffer, read once per entry

  G.scene('accesso', {
    hud: false, back: false,
    enter: function () {

        G.ui.button({id:'profiles-next',x:810,y:590,w:220,h:96,color:C.water,label:'→',disabled:(accountPage+1)*4>G.accounts.list().length,onTap:function(){accountPage++;}});

      // discreet parent door
      G.ui.round({
        id: 'gear-login', x: W - 56, y: H - 52, r: 30, color: 'rgba(255,246,224,.55)',
        icon: function (cc, x, yy, r) {
          cc.save(); cc.fillStyle = C.ink;

            var a = i * Math.PI / 4 + G.t * .4;
            cc.save(); cc.translate(x + Math.cos(a) * r * .5, yy + Math.sin(a) * r * .5); cc.rotate(a);
            cc.fillRect(-3, -5, 10, 10); cc.restore();
          }
          cc.beginPath(); cc.arc(x, yy, r * .32, 0, 7); cc.fill();
          cc.fillStyle = 'rgba(255,246,224,.9)'; cc.beginPath(); cc.arc(x, yy, r * .13, 0, 7); cc.fill();
          cc.restore();

      });

  /* ------------------------------------------------------- scene: segreto */
  var sg = { id: null, taps: [], shake: 0, fails: 0, look: null };

  G.scene('segreto', {
    hud: false, back: false,
    enter: function (p) {
      sg.id = p && p.id; sg.taps = []; sg.shake = 0; sg.fails = 0;

    }
    G.ui.button({id:'family-switch',x:650,y:440,w:460,h:100,color:C.blueberry,label:'Cambia giocatore',onTap:function(){G.accounts.logout();G.go('accesso');}});
    G.ui.button({id:'family-back',x:650,y:565,w:460,h:100,color:C.leaf,label:'Torna al gioco',onTap:function(){G.go(G.account?'menu':'accesso');}});
  }});
})();


/* ==================== 99-boot.js ==================== */
/* Boot: tablet niceties, then "chi dirige la stazione?".

   Per un pezzo qui veniva creato un profilo in silenzio, perche' il gioco non
   aveva ancora niente da ricordare. Adesso ne ha: giro migliore per pista,
   vittorie, difficolta', colore del kart. Due bambini sullo stesso tablet
   vogliono due elenchi di record, non uno mescolato — quindi si comincia da
   dove si comincia in Dino Giungla, e per la stessa ragione. */
(function () {
  'use strict';

  G.toggleFullscreen = function () {
    var el = document.documentElement;
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        (el.requestFullscreen || el.webkitRequestFullscreen).call(el, { navigationUI: 'hide' });
      }
    } catch (e) { /* desktop browsers may refuse; harmless */ }
  };

  var askedFullscreen = false;
  function firstTouch() {
    G.resumeAudio();
    if (!askedFullscreen) {
      askedFullscreen = true;
      if (matchMedia('(pointer: coarse)').matches && !document.fullscreenElement) G.toggleFullscreen();
    }
    keepAwake();
  }
  window.addEventListener('pointerdown', firstTouch, { once: false, passive: true });

  var lock = null;
  function keepAwake() {
    if (lock || !navigator.wakeLock) return;
    navigator.wakeLock.request('screen').then(function (l) {
      lock = l;
      l.addEventListener('release', function () { lock = null; });
    }).catch(function () { lock = null; });
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) keepAwake();
  });

  if (window.speechSynthesis) { try { speechSynthesis.getVoices(); } catch (e) {} }

  /* The engine came from another Dino game. Here home is the station menu, and
     without this the back button would call G.go on a scene that does not exist. */
  G.home = function () { G.go(G.account ? 'menu' : 'accesso'); };

  /* Si passa SEMPRE dalla schermata dei piloti, anche con un profilo solo:
     e' li' che l'altro fratello si accorge di poterne fare uno suo. */
  G.start('accesso');
})();
